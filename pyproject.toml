[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bashboy"
version = "0.1.0"
description = "Classify shell commands as allow or deny before an agent runs them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bashboy = "bashboy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/bashboy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
